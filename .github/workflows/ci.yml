name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
          POSTGRES_DB: tessera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessera -d tessera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tessera:tessera@localhost:5432/tessera
      JWT_ACCESS_SECRET: ci-test-secret-must-be-at-least-32-chars
      JWT_ADMIN_SECRET: ci-admin-secret-must-be-at-least-32-chars
      JWT_PURPOSE_SECRET: ci-purpose-secret-must-be-at-least-32-chars
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      WEB_ORIGIN: http://127.0.0.1:3100
      COOKIE_SECURE: 'false'
      STORAGE_DRIVER: fs
      MEDIA_PROCESS: inline
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Playwright Chromium
        run: pnpm --filter @tessera/web exec playwright install --with-deps chromium
      - run: pnpm e2e
